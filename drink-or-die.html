<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drink or Die — Market Variant</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060b;--surface:rgba(255,255,255,0.025);--border:rgba(255,255,255,0.07);--text:#ddd5c4;--muted:#7a7060;--gold:#e8b84b;--gold-dim:rgba(232,184,75,0.15);--green:#3ddc84;--red:#e74c3c;--fire:#e74c3c;--ice:#4ba3e8;--light:#f0d04a;--shadow:#a86edb;--nature:#3ddc84}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(ellipse at 15% 50%,rgba(232,75,75,.04) 0%,transparent 50%),radial-gradient(ellipse at 85% 30%,rgba(75,163,232,.04) 0%,transparent 50%),radial-gradient(ellipse at 50% 90%,rgba(61,220,132,.03) 0%,transparent 40%);color:var(--text);font-family:'EB Garamond',Georgia,serif;min-height:100vh;padding:14px}
h1{font-family:'Cinzel',serif;font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#e8b84b,#e74c3c,#a86edb);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:2px}
.subtitle{text-align:center;color:var(--muted);font-style:italic;font-size:.9rem;margin-bottom:14px}
.wrap{max-width:760px;margin:0 auto}

/* Turn banner */
.turn-banner{text-align:center;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:1px;padding:8px;margin-bottom:12px;border-radius:8px;background:var(--surface);border:1.5px solid var(--border);transition:all .3s}
.turn-banner.you{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

/* Market row */
.market-label{text-align:center;font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.market{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;min-height:104px}
.mcard{width:66px;height:96px;border-radius:9px;border:2px solid;background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:all .25s;cursor:default}
.mcard .em{font-size:1.9rem;line-height:1}
.mcard .vl{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:900}
.mcard.fire{border-color:var(--fire)}.mcard.fire .vl{color:var(--fire)}
.mcard.ice{border-color:var(--ice)}.mcard.ice .vl{color:var(--ice)}
.mcard.light{border-color:var(--light)}.mcard.light .vl{color:var(--light)}
.mcard.shadow{border-color:var(--shadow)}.mcard.shadow .vl{color:var(--shadow)}
.mcard.nature{border-color:var(--nature)}.mcard.nature .vl{color:var(--nature)}
.mcard.hl{transform:translateY(-6px) scale(1.05);box-shadow:0 0 16px var(--gold-dim)}
.mcard.taken{opacity:0;transform:scale(.5)}

/* Take options */
.options{margin:14px 0}
.opt-group{margin-bottom:10px}
.opt-group h3{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:center;margin-bottom:6px}
.opt-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.opt-btn{font-family:'Cinzel',serif;font-size:.9rem;font-weight:700;padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.opt-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.opt-btn .gain{font-size:.78rem;color:var(--muted)}
.opt-btn .gain.pos{color:var(--green)}
.opt-btn .gain.neg{color:var(--red)}
.opt-btn.waiting{opacity:.4;pointer-events:none}

/* Players */
.players{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.pl{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;transition:all .3s}
.pl.active{border-color:var(--gold);box-shadow:0 0 14px var(--gold-dim)}
.pl.leader{border-left:4px solid var(--gold)}
.pl-top{display:flex;justify-content:space-between;align-items:center}
.pl-name{font-family:'Cinzel',serif;font-size:.92rem;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:7px}
.pl-rank{font-size:1rem}
.pl-score{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:900;color:var(--gold)}
.pl-score.neg{color:var(--red)}
.pl-tally{display:flex;gap:9px;flex-wrap:wrap;margin-top:5px;font-size:.85rem}
.pl-tally .t{display:flex;align-items:center;gap:2px;color:var(--muted)}
.pl-bd{font-size:.72rem;color:#5a5248;margin-top:4px}

/* Log */
.log{margin-top:14px;max-height:90px;overflow-y:auto;font-size:.8rem;color:var(--muted);background:rgba(0,0,0,.2);border-radius:8px;padding:8px 12px;border:1px solid var(--border)}
.log div{margin-bottom:2px}

/* Controls */
.ctrl{text-align:center;margin-top:14px}
.btn{font-family:'Cinzel',serif;font-size:.88rem;padding:9px 26px;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .2s;letter-spacing:1px;margin:0 4px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{border-color:var(--gold);color:var(--gold);background:var(--gold-dim)}

/* Game over */
.go-overlay{position:fixed;inset:0;background:rgba(7,6,11,.92);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.go-overlay.show{display:flex}
.go-card{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:28px 34px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px var(--gold-dim)}
.go-card h2{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:900;color:var(--gold);letter-spacing:2px;margin-bottom:16px}
.go-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;margin-bottom:6px;background:rgba(0,0,0,.25)}
.go-row.win{background:var(--gold-dim);border:1px solid var(--gold)}
.go-row .gn{font-family:'Cinzel',serif;font-weight:700;display:flex;gap:7px;align-items:center}
.go-row .gs{font-family:'Cinzel',serif;font-weight:900;font-size:1.2rem;color:var(--gold)}

.footer{text-align:center;color:#3a3428;font-size:.74rem;margin-top:18px}

@media(max-width:500px){
  .mcard{width:56px;height:82px}
  .mcard .em{font-size:1.6rem}
  .mcard .vl{font-size:1.25rem}
  .opt-btn{font-size:.82rem;padding:7px 10px}
}
</style>
</head>
<body>

<div class="wrap">
  <h1>🍷 Market Variant</h1>
  <p class="subtitle">Drink or Die — Family Mode · Full Information</p>

  <div class="turn-banner" id="turnBanner">Your turn</div>

  <div class="market-label">The Market</div>
  <div class="market" id="market"></div>

  <div class="options" id="options"></div>

  <div class="players" id="players"></div>

  <div class="log" id="log"></div>

  <div class="ctrl">
    <button class="btn primary" onclick="newGame()">🔄 New Game</button>
  </div>

  <div class="footer">
    Take all cards of one element OR one value. Refill to 5. Score = 🔥+🧊+✨+💀 − |Δ−🌿|×3 (🌿 = 0 raw pts)
  </div>
</div>

<div class="go-overlay" id="goOverlay">
  <div class="go-card">
    <h2>🏆 Final Scores</h2>
    <div id="goRows"></div>
    <button class="btn primary" style="margin-top:16px" onclick="newGame()">Play Again</button>
  </div>
</div>

<script>
const ELS=[
  {id:'fire',em:'🔥'},{id:'ice',em:'🧊'},{id:'light',em:'✨'},{id:'shadow',em:'💀'},{id:'nature',em:'🌿'}
];
const EM={fire:'🔥',ice:'🧊',light:'✨',shadow:'💀',nature:'🌿'};
const NAMES=['You','Sage Vex','Mira Bell','Old Crow'];
const PC=4;
const ROW=5;

let G=null;

function mkDeck(){
  const d=[];
  for(const el of ELS) for(const v of [1,2,3]) for(let i=0;i<6;i++) d.push({el:el.id,v});
  return d;
}
function shuf(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=0|Math.random()*(i+1);const t=r[i];r[i]=r[j];r[j]=t;}return r;}

function score(cards){
  const s={fire:0,ice:0,light:0,shadow:0,nature:0};
  for(const c of cards) s[c.el]+=c.v;
  const raw=s.fire+s.ice+s.light+s.shadow; // nature = 0 raw
  const delta=Math.abs(s.fire-s.ice)+Math.abs(s.light-s.shadow);
  const dF=Math.abs(delta-s.nature);
  return {raw,delta,nat:s.nature,dF,total:raw-dF*3,sums:s};
}

function newGame(){
  document.getElementById('goOverlay').classList.remove('show');
  const dk=shuf(mkDeck());
  const row=[];
  for(let i=0;i<ROW&&dk.length;i++) row.push(dk.pop());
  G={dk,row,collected:[[],[],[],[]],turn:0,log:[],busy:false,over:false};
  aL('Game started! Take all cards of one element or one value.');
  render();
  if(G.turn!==0) setTimeout(aiTurn,800);
}

function aL(t){G.log.unshift(t);if(G.log.length>20)G.log.pop();}

// Available take options from current row
function takeOptions(row){
  const opts=[];
  // by element
  const elsPresent=[...new Set(row.map(c=>c.el))];
  for(const el of elsPresent){
    const cards=row.filter(c=>c.el===el);
    opts.push({type:'element',key:el,cards});
  }
  // by value
  const valsPresent=[...new Set(row.map(c=>c.v))].sort();
  for(const v of valsPresent){
    const cards=row.filter(c=>c.v===v);
    opts.push({type:'value',key:v,cards});
  }
  return opts;
}

function applyTake(p,opt){
  // remove matched cards from row
  const matched=opt.cards;
  G.collected[p]=G.collected[p].concat(matched);
  // remove from row by reference
  for(const m of matched){
    const idx=G.row.indexOf(m);
    if(idx>=0) G.row.splice(idx,1);
  }
  // refill to ROW
  while(G.row.length<ROW && G.dk.length) G.row.push(G.dk.pop());

  const label=opt.type==='element'?EM[opt.key]:('value '+opt.key);
  aL(`${NAMES[p]} took ${matched.length}× ${label}.`);
}

function endCheck(){
  // Game ends when deck empty and row empty
  if(G.dk.length===0 && G.row.length===0){
    G.over=true;
    return true;
  }
  return false;
}

function nextTurn(){
  G.turn=(G.turn+1)%PC;
  // if row empty but can't refill -> game over handled in endCheck
  if(endCheck()){render();showGameOver();return;}
  render();
  if(G.turn!==0) setTimeout(aiTurn,800);
}

function humanTake(optIdx){
  if(G.busy||G.over||G.turn!==0) return;
  const opts=takeOptions(G.row);
  const opt=opts[optIdx];
  if(!opt) return;
  G.busy=true;
  // highlight then apply
  highlightTake(opt);
  setTimeout(()=>{
    applyTake(0,opt);
    G.busy=false;
    nextTurn();
  },450);
}

function aiTurn(){
  if(G.over) return;
  const p=G.turn;
  const opts=takeOptions(G.row);
  if(opts.length===0){nextTurn();return;}
  // Evaluate each option by marginal score gain
  const cur=score(G.collected[p]).total;
  let best=opts[0],bestGain=-Infinity;
  for(const o of opts){
    const after=score(G.collected[p].concat(o.cards)).total;
    let gain=after-cur;
    // tiny tiebreak: prefer more cards collected (more material)
    gain+=o.cards.length*0.01;
    if(gain>bestGain){bestGain=gain;best=o;}
  }
  G.busy=true;
  highlightTake(best);
  setTimeout(()=>{
    applyTake(p,best);
    G.busy=false;
    nextTurn();
  },550);
}

function highlightTake(opt){
  const cards=document.querySelectorAll('.mcard');
  G.row.forEach((c,i)=>{
    if(opt.cards.includes(c) && cards[i]) cards[i].classList.add('hl');
  });
}

function ranks(){
  const totals=G.collected.map((c,p)=>({p,total:score(c).total}));
  const sorted=[...totals].sort((a,b)=>b.total-a.total);
  const rk={};
  sorted.forEach((r,i)=>rk[r.p]=i);
  return {rk,sorted};
}

function render(){
  // turn banner
  const tb=document.getElementById('turnBanner');
  if(G.over){tb.textContent='Game Over';tb.className='turn-banner';}
  else if(G.turn===0){tb.textContent='⟶ Your turn — pick a take';tb.className='turn-banner you';}
  else {tb.textContent=`${NAMES[G.turn]} is choosing…`;tb.className='turn-banner';}

  // market
  let mh='';
  for(const c of G.row){
    mh+=`<div class="mcard ${c.el}"><span class="em">${EM[c.el]}</span><span class="vl">${c.v}</span></div>`;
  }
  document.getElementById('market').innerHTML=mh;

  // options (only on human turn)
  const optDiv=document.getElementById('options');
  if(G.turn===0 && !G.over && !G.busy){
    const opts=takeOptions(G.row);
    const cur=score(G.collected[0]).total;
    const elOpts=opts.filter(o=>o.type==='element');
    const vlOpts=opts.filter(o=>o.type==='value');
    let h='';
    h+='<div class="opt-group"><h3>Take by Element</h3><div class="opt-btns">';
    for(const o of elOpts){
      const idx=opts.indexOf(o);
      const gain=score(G.collected[0].concat(o.cards)).total-cur;
      const gc=gain>0?'pos':gain<0?'neg':'';
      h+=`<button class="opt-btn" onclick="humanTake(${idx})">${EM[o.key]} ×${o.cards.length} <span class="gain ${gc}">${gain>=0?'+':''}${gain}</span></button>`;
    }
    h+='</div></div>';
    h+='<div class="opt-group"><h3>Take by Value</h3><div class="opt-btns">';
    for(const o of vlOpts){
      const idx=opts.indexOf(o);
      const gain=score(G.collected[0].concat(o.cards)).total-cur;
      const gc=gain>0?'pos':gain<0?'neg':'';
      const ems=[...new Set(o.cards.map(c=>EM[c.el]))].join('');
      h+=`<button class="opt-btn" onclick="humanTake(${idx})">${o.key} ×${o.cards.length} <span style="font-size:.8rem">${ems}</span> <span class="gain ${gc}">${gain>=0?'+':''}${gain}</span></button>`;
    }
    h+='</div></div>';
    optDiv.innerHTML=h;
  } else {
    optDiv.innerHTML='';
  }

  // players
  const {rk}=ranks();
  let ph='';
  for(let p=0;p<PC;p++){
    const sc=score(G.collected[p]);
    const medal=rk[p]===0?'👑':rk[p]===1?'🥈':rk[p]===2?'🥉':'4️⃣';
    const active=p===G.turn&&!G.over?' active':'';
    const leader=rk[p]===0?' leader':'';
    const s=sc.sums;
    ph+=`<div class="pl${active}${leader}">
      <div class="pl-top">
        <span class="pl-name"><span class="pl-rank">${medal}</span>${NAMES[p]}</span>
        <span class="pl-score ${sc.total<0?'neg':''}">${sc.total}</span>
      </div>
      <div class="pl-tally">
        <span class="t">🔥${s.fire}</span><span class="t">🧊${s.ice}</span>
        <span class="t">✨${s.light}</span><span class="t">💀${s.shadow}</span>
        <span class="t">🌿${s.nature}</span>
        <span class="t" style="margin-left:auto">${G.collected[p].length} cards</span>
      </div>
      <div class="pl-bd">Raw ${sc.raw} · Δ ${sc.delta}−🌿${sc.nat}=${sc.dF} · Pen −${sc.dF*3}</div>
    </div>`;
  }
  document.getElementById('players').innerHTML=ph;

  // log
  document.getElementById('log').innerHTML=G.log.map(l=>`<div>${l}</div>`).join('');
}

function showGameOver(){
  const {sorted}=ranks();
  let h='';
  const medals=['🥇','🥈','🥉','4️⃣'];
  sorted.forEach((r,i)=>{
    const sc=score(G.collected[r.p]);
    h+=`<div class="go-row ${i===0?'win':''}">
      <span class="gn">${medals[i]} ${NAMES[r.p]}</span>
      <span class="gs">${sc.total} pts</span>
    </div>`;
  });
  document.getElementById('goRows').innerHTML=h;
  document.getElementById('goOverlay').classList.add('show');
}

newGame();
</script>
</body>
</html>
