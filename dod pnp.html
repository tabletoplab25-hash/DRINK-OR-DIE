<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>dod pnp</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 10mm; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cinzel',serif; background:#fff; }

.page {
  width: 190mm;
  height: 277mm;
  display: grid;
  grid-template-columns: repeat(3, 63.5mm);
  grid-template-rows: repeat(3, 88.9mm);
  gap: 0mm;
  justify-content: center;
  align-content: center;
  page-break-after: always;
  margin: 0 auto;
}

.card {
  width: 63.5mm;
  height: 88.9mm;
  border: 1px solid #aaa;
  border-radius: 3.5mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #fff;
}

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 3.5mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1mm;
  position: relative;
}

/* Inner colored border */
.card-border {
  position: absolute;
  top: 2.5mm; left: 2.5mm; right: 2.5mm; bottom: 2.5mm;
  border: 2px solid;
  border-radius: 2.5mm;
  pointer-events: none;
}

/* Corner values */
.corner-tl, .corner-br {
  position: absolute;
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.corner-tl { top: 4mm; left: 4.5mm; }
.corner-br { bottom: 4mm; right: 4.5mm; transform: rotate(180deg); }
.corner-emoji { font-size: 22pt; }
.corner-val { font-size: 26pt; font-weight: 900; }

/* Center content */
.card-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1mm;
}
.card-emoji { font-size: 48pt; }
.card-value { font-size: 42pt; font-weight: 900; }
.card-name { font-size: 9pt; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; }

/* Element colors - text/border only, white background */
.el-fire .card-border { border-color: #d32f2f; }
.el-fire .corner-tl, .el-fire .corner-br, .el-fire .card-value, .el-fire .card-name { color: #d32f2f; }

.el-ice .card-border { border-color: #1976d2; }
.el-ice .corner-tl, .el-ice .corner-br, .el-ice .card-value, .el-ice .card-name { color: #1976d2; }

.el-light .card-border { border-color: #c8a000; }
.el-light .corner-tl, .el-light .corner-br, .el-light .card-value, .el-light .card-name { color: #c8a000; }

.el-shadow .card-border { border-color: #7b1fa2; }
.el-shadow .corner-tl, .el-shadow .corner-br, .el-shadow .card-value, .el-shadow .card-name { color: #7b1fa2; }

.el-nature .card-border { border-color: #2e7d32; }
.el-nature .corner-tl, .el-nature .corner-br, .el-nature .card-value, .el-nature .card-name { color: #2e7d32; }

@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .instructions { display: none; }
}

.instructions {
  text-align: center; padding: 16px; color: #666; font-family: sans-serif; font-size: 11pt;
  border-bottom: 1px solid #ddd; margin-bottom: 10px;
}
.instructions b { color: #333; }
</style>
</head>
<body>

<div class="instructions">
  <b>Drink or Die — Low Ink Printable Cards</b> | 90 cards (10 pages of 9) | Poker size: 63.5 × 88.9 mm<br>
  White background, minimal ink usage. Print at 100% scale on A4, cut along borders.
</div>

<script>
const elements = [
  { id:'fire', name:'Fire', emoji:'🔥' },
  { id:'ice', name:'Ice', emoji:'🧊' },
  { id:'light', name:'Light', emoji:'✨' },
  { id:'shadow', name:'Shadow', emoji:'💀' },
  { id:'nature', name:'Nature', emoji:'🌿' },
];

const cards = [];
for (const el of elements)
  for (const v of [1,2,3])
    for (let i = 0; i < 6; i++)
      cards.push({ el, v });

let html = '';
for (let i = 0; i < cards.length; i++) {
  if (i % 9 === 0) html += '<div class="page">';
  const c = cards[i];
  html += `
    <div class="card el-${c.el.id}">
      <div class="card-inner">
        <div class="card-border"></div>
        <div class="corner-tl">
          <span class="corner-emoji">${c.el.emoji}</span>
          <span class="corner-val">${c.v}</span>
        </div>
        <div class="corner-br">
          <span class="corner-emoji">${c.el.emoji}</span>
          <span class="corner-val">${c.v}</span>
        </div>
        <div class="card-center">
          <span class="card-emoji">${c.el.emoji}</span>
          <span class="card-value">${c.v}</span>
          <span class="card-name">${c.el.name}</span>
        </div>
      </div>
    </div>`;
  if (i % 9 === 8 || i === cards.length - 1) html += '</div>';
}
document.body.insertAdjacentHTML('beforeend', html);
</script>
</body>
</html>
