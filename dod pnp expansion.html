<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drink or Die — Expansion Cards (Low Ink)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
@page { size: A4; margin: 10mm; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cinzel',serif; background:#fff; }

.page {
  width: 190mm;
  height: 277mm;
  display: grid;
  grid-template-columns: repeat(3, 63.5mm);
  grid-template-rows: repeat(3, 88.9mm);
  gap: 0mm;
  justify-content: center;
  align-content: center;
  page-break-after: always;
  margin: 0 auto;
}

.card {
  width: 63.5mm;
  height: 88.9mm;
  border: 1px solid #aaa;
  border-radius: 3.5mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #fff;
}
.card.empty { border: 1px dashed #ddd; }

.card-inner {
  width: 100%;
  height: 100%;
  border-radius: 3.5mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
  position: relative;
}

.card-border {
  position: absolute;
  top: 2.5mm; left: 2.5mm; right: 2.5mm; bottom: 2.5mm;
  border: 2.5px solid;
  border-radius: 2.5mm;
  pointer-events: none;
}
.card.oneshot .card-border { border-style: dashed; }

/* Corners */
.corner-tl, .corner-br {
  position: absolute;
  line-height: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5mm;
}
.corner-tl { top: 4mm; left: 4.5mm; }
.corner-br { bottom: 4mm; right: 4.5mm; transform: rotate(180deg); }
.corner-emoji { font-size: 16pt; }
.corner-val { font-size: 12pt; font-weight: 900; }

/* Center */
.card-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 0.5mm;
  padding: 0 4.5mm;
  margin-top: 1mm;
}
.card-emoji { font-size: 38pt; line-height: 1.1; }
.card-title { font-size: 10pt; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; margin-top: 0.5mm; }
.card-sub { font-size: 8pt; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
.card-desc {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 7.5pt; line-height: 1.3; color: #333;
  margin-top: 1.5mm;
  max-width: 50mm;
}
.card-tag {
  font-size: 6pt; letter-spacing: 2px; text-transform: uppercase;
  margin-top: 2mm; padding: 1px 5px;
  border: 1.5px solid; border-radius: 2mm;
  font-weight: 700;
}
.card-pts {
  font-size: 18pt; font-weight: 900; margin-top: 1mm;
}

@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .instructions { display: none; }
}
.instructions {
  text-align: center; padding: 16px; color: #666; font-family: sans-serif; font-size: 11pt;
  border-bottom: 1px solid #ddd; margin-bottom: 10px;
}
.instructions b { color: #333; }
</style>
</head>
<body>

<div class="instructions">
  <b>Drink or Die — Expansion Cards (Low Ink)</b> | 33 special cards (4 pages) | Poker size: 63.5 × 88.9 mm<br>
  <b>Dashed border</b> = One-shot (use &amp; discard). <b>Solid border</b> = Permanent (stays in cauldron).<br>
  Print at 100% scale on A4, cut along borders. Shuffle into main deck.
</div>

<script>
const cards = [];

// Helper to push N copies
function add(n, data) { for (let i = 0; i < n; i++) cards.push({...data}); }

// 1. AMPLIFIERS — 5 elements × 3 copies = 15
const amps = [
  { el:'Fire', emoji:'🔥', clr:'#d32f2f' },
  { el:'Ice', emoji:'🧊', clr:'#1976d2' },
  { el:'Light', emoji:'✨', clr:'#c8a000' },
  { el:'Shadow', emoji:'💀', clr:'#7b1fa2' },
  { el:'Nature', emoji:'🌿', clr:'#2e7d32' },
];
for (const a of amps) {
  add(3, {
    icon: a.emoji, cornerIcon: '⚡', title: 'Amplifier', sub: a.el,
    desc: `+1 Victory point for each ${a.el} card (not value) in your cauldron at end of game.`,
    clr: a.clr, oneshot: false, tag: 'PERMANENT', pts: ''
  });
}

// 2. THIEF ×3
add(3, {
  icon: '🦹', cornerIcon: '🦹', title: 'Thief', sub: '',
  desc: 'When you drink a potion containing this card, immediately steal 1 card from any opponent\'s cauldron. Then discard this card.',
  clr: '#37474f', oneshot: true, tag: 'ONE-SHOT', pts: ''
});

// 3. SWAP ×3
add(3, {
  icon: '🔄', cornerIcon: '🔄', title: 'Swap', sub: '',
  desc: 'Exchange one card from your cauldron with one card from the current potion. Then discard this card.',
  clr: '#e65100', oneshot: true, tag: 'ONE-SHOT', pts: ''
});

// 4. POISON ×3
add(3, {
  icon: '🧪', cornerIcon: '🧪', title: 'Poison', sub: '',
  desc: "Worth −1 PV at the end of the game.",
  clr: '#4a148c', oneshot: false, tag: 'PERMANENT · −1 PV', pts: '−1'
});

// 5. DISTILLATE ×3
add(3, {
  icon: '💧', cornerIcon: '💧', title: 'Distillate', sub: '',
  desc: 'At end of game, you CAN remove any one card from your cauldron (your choice). Then discard both.',
  clr: '#00695c', oneshot: false, tag: 'PERMANENT · 0 PV', pts: '0'
});

// 6. PURIFIER ×3
add(3, {
  icon: '✳️', cornerIcon: '✳️', title: 'Purifier', sub: '',
  desc: 'At end of game, you can reduce your Delta by 1 point for free.',
  clr: '#00897b', oneshot: false, tag: 'PERMANENT', pts: ''
});

// 7. TIME BOMB ×3
add(3, {
  icon: '💣', cornerIcon: '💣', title: 'Time Bomb', sub: '',
  desc: 'If your Final Delta is exactly 0: worth +4 points. Otherwise: worth −2 points.',
  clr: '#bf8f00', oneshot: false, tag: 'PERMANENT · +4 / −2', pts: '±'
});

// Generate HTML
let html = '';
const total = cards.length;
const pages = Math.ceil(total / 9);

for (let i = 0; i < pages * 9; i++) {
  if (i % 9 === 0) html += '<div class="page">';

  if (i < total) {
    const c = cards[i];
    const os = c.oneshot ? ' oneshot' : '';
    html += `
      <div class="card${os}">
        <div class="card-inner">
          <div class="card-border" style="border-color:${c.clr}"></div>
          <div class="corner-tl">
            <span class="corner-emoji">${c.cornerIcon}</span>
            <span class="corner-val" style="color:${c.clr}">${c.pts || '✦'}</span>
          </div>
          <div class="corner-br">
            <span class="corner-emoji">${c.cornerIcon}</span>
            <span class="corner-val" style="color:${c.clr}">${c.pts || '✦'}</span>
          </div>
          <div class="card-center">
            <span class="card-emoji">${c.icon}</span>
            <span class="card-title" style="color:${c.clr}">${c.title}</span>
            ${c.sub ? `<span class="card-sub" style="color:${c.clr}">${c.sub}</span>` : ''}
            <span class="card-desc">${c.desc}</span>
            <span class="card-tag" style="color:${c.clr};border-color:${c.clr}">${c.tag}</span>
          </div>
        </div>
      </div>`;
  } else {
    html += '<div class="card empty"></div>';
  }

  if (i % 9 === 8) html += '</div>';
}

document.body.insertAdjacentHTML('beforeend', html);
</script>
</body>
</html>
